
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ripple-falkordb
    restart: unless-stopped

    ports:
      - "6379:6379"
      - "3000:3000"

    environment:
      REDIS_ARGS: "--appendonly yes"

    volumes:
      - falkordb_data:/var/lib/falkordb/data

volumes:
  falkordb_data:
    external: true
    name: falkordb_data
